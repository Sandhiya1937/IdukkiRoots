<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - IdukkiRoots</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="header-container">
            <a href="/" class="logo">
                <div class="logo-icon"><i class="fas fa-seedling"></i></div>
                <span>IdukkiRoots</span>
            </a>
            <div class="header-actions">
                <a href="/products.html" class="btn btn-outline btn-sm"><i class="fas fa-arrow-left"></i> Continue Shopping</a>
                <a href="/profile.html" class="action-btn"><i class="far fa-user"></i><span id="user-btn-text">Account</span></a>
            </div>
        </div>
    </header>

    <!-- Cart Layout -->
    <main class="cart-layout" style="max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem;">
        <!-- Left: Cart Items List -->
        <div>
            <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 1.25rem;">Shopping Cart</h2>

            <div id="cart-items-container" style="background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden;">
                <p style="text-align: center; color: var(--text-muted); padding: 3rem;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading your cart...
                </p>
            </div>
        </div>

        <!-- Right: Summary Card -->
        <aside class="summary-card">
            <h3 style="font-size: 1.2rem; color: var(--secondary); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);">Order Summary</h3>

            <!-- Coupon Input -->
            <div style="margin-bottom: 1.25rem;">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.4rem;">Have a Coupon Code?</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="coupon-code-input" placeholder="e.g. IDUKKI10" class="search-input" style="border: 1px solid var(--border-color); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.85rem; text-transform: uppercase;">
                    <button class="btn btn-secondary btn-sm" onclick="applyCoupon()"><i class="fas fa-tag"></i> Apply</button>
                </div>
                <div id="coupon-message" style="font-size: 0.8rem; margin-top: 0.4rem;"></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.6rem; font-size: 0.9rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Subtotal</span>
                    <span id="summary-subtotal" style="font-weight: 700;">₹0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; color: var(--success);" id="discount-row">
                    <span>Coupon Discount</span>
                    <span id="summary-discount">-₹0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--text-muted);">Delivery Charge</span>
                    <span style="color: var(--success); font-weight: 700;">FREE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; color: var(--secondary); border-top: 2px dashed var(--border-color); padding-top: 0.8rem; margin-top: 0.4rem;">
                    <span>Total Amount</span>
                    <span id="summary-total" style="color: var(--primary-dark);">₹0.00</span>
                </div>
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; height: 46px; font-size: 1rem;" onclick="proceedToCheckout()">
                Proceed to Checkout <i class="fas fa-arrow-right"></i>
            </button>
        </aside>
    </main>

    <script src="/js/api.js"></script>
    <script>
        let currentCart = [];
        let appliedCoupon = null;

        async function loadCart() {
            updateHeaderState();
            try {
                currentCart = await API.getCart();
                renderCart(currentCart);
            } catch (err) {
                console.error('Cart load error', err);
            }
        }

        function updateHeaderState() {
            const user = API.getUser();
            document.getElementById('user-btn-text').textContent = user ? (user.first_name || 'Account') : 'Login';
        }

        function renderCart(cart) {
            const container = document.getElementById('cart-items-container');

            if (!cart || cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem 2rem;">
                        <i class="fas fa-shopping-basket" style="font-size: 3.5rem; color: var(--text-light); margin-bottom: 1rem;"></i>
                        <h3 style="color: var(--secondary);">Your Shopping Cart is Empty</h3>
                        <p style="color: var(--text-muted); margin: 0.5rem 0 1.5rem;">Explore our high range spices and fresh produce.</p>
                        <a href="/products.html" class="btn btn-primary"><i class="fas fa-store"></i> Start Shopping</a>
                    </div>
                `;
                calculateTotals(0);
                return;
            }

            let subtotal = 0;
            let html = '';

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                const img = item.image || 'https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=300&q=80';

                html += `
                    <div style="display: grid; grid-template-columns: 80px 1fr 120px 100px 40px; gap: 1rem; align-items: center; padding: 1.25rem; border-bottom: 1px solid var(--border-color);">
                        <img src="${img}" style="width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                        <div>
                            <h4 style="font-size: 1rem; color: var(--secondary); margin-bottom: 0.2rem;">${item.product_name || 'Product'}</h4>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">${item.variant_details || ''}</span>
                            <div style="font-weight: 700; color: var(--text-main); margin-top: 0.3rem;">${API.formatCurrency(item.price)}</div>
                        </div>

                        <div style="display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; height: 36px; width: 100px;">
                            <button onclick="changeQty(${item.variant_id}, ${item.quantity - 1})" style="width: 30px; border: none; background: #f1f5f9; font-weight: 700; cursor: pointer;">-</button>
                            <span style="flex: 1; text-align: center; font-weight: 700; font-size: 0.9rem;">${item.quantity}</span>
                            <button onclick="changeQty(${item.variant_id}, ${item.quantity + 1})" style="width: 30px; border: none; background: #f1f5f9; font-weight: 700; cursor: pointer;">+</button>
                        </div>

                        <div style="text-align: right; font-weight: 800; color: var(--secondary); font-size: 1.05rem;">
                            ${API.formatCurrency(itemTotal)}
                        </div>

                        <button onclick="removeItem(${item.variant_id})" style="border: none; background: none; color: var(--danger); font-size: 1.1rem; cursor: pointer;" title="Remove Item">
                            <i class="far fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            calculateTotals(subtotal);
        }

        async function changeQty(variantId, newQty) {
            await API.updateCartQuantity(variantId, newQty);
            loadCart();
        }

        async function removeItem(variantId) {
            await API.updateCartQuantity(variantId, 0);
            loadCart();
        }

        function calculateTotals(subtotal) {
            document.getElementById('summary-subtotal').textContent = API.formatCurrency(subtotal);
            
            let discount = 0;
            if (appliedCoupon) {
                discount = appliedCoupon.discount_amount;
            }

            document.getElementById('summary-discount').textContent = `- ${API.formatCurrency(discount)}`;
            const total = Math.max(0, subtotal - discount);
            document.getElementById('summary-total').textContent = API.formatCurrency(total);
        }

        async function applyCoupon() {
            const code = document.getElementById('coupon-code-input').value.trim();
            const msg = document.getElementById('coupon-message');
            if (!code) {
                msg.style.color = 'var(--danger)';
                msg.textContent = 'Please enter a coupon code.';
                return;
            }

            const subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            try {
                const res = await API.request('/orders/validate-coupon', {
                    method: 'POST',
                    body: JSON.stringify({ coupon_code: code, subtotal })
                });
                appliedCoupon = res;
                sessionStorage.setItem('applied_coupon', JSON.stringify(res));
                msg.style.color = 'var(--success)';
                msg.textContent = `Coupon "${res.code}" applied! Saved ${API.formatCurrency(res.discount_amount)}`;
                calculateTotals(subtotal);
            } catch (err) {
                appliedCoupon = null;
                sessionStorage.removeItem('applied_coupon');
                msg.style.color = 'var(--danger)';
                msg.textContent = err.message || 'Invalid coupon code';
                calculateTotals(subtotal);
            }
        }

        function proceedToCheckout() {
            if (currentCart.length === 0) {
                API.showToast('Your cart is empty!', 'warning');
                return;
            }
            window.location.href = '/checkout.html';
        }

        window.addEventListener('DOMContentLoaded', loadCart);
        window.addEventListener('cart-changed', loadCart);
    </script>
</body>
</html>
